spring.application.name=ai-analysis-service
server.port=8085

# The database belongs exclusively to ai-analysis-service.
spring.datasource.url=${AI_ANALYSIS_DB_URL:jdbc:postgresql://localhost:5433/ai_analysis_db}
spring.datasource.username=${AI_ANALYSIS_DB_USERNAME:postgres}
spring.datasource.password=${AI_ANALYSIS_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${AI_ANALYSIS_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=ai-analysis-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.hiba.aianalysisservice.event
spring.kafka.consumer.properties.spring.json.value.default.type=com.hiba.aianalysisservice.event.IncidentEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.listener.ack-mode=record

# Used only by the retry/DLQ publisher.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# RAG foundation. MOCK keeps local development and unit tests independent from external APIs.
rag.embedding.provider=${RAG_EMBEDDING_PROVIDER:MOCK}
rag.embedding.url=${RAG_EMBEDDING_URL:http://localhost:11434}
rag.embedding.model=${RAG_EMBEDDING_MODEL:bge-m3}
rag.embedding.dimension=${RAG_EMBEDDING_DIMENSION:8}
rag.chunking.max-size=${RAG_CHUNK_MAX_SIZE:1000}
rag.chunking.overlap=${RAG_CHUNK_OVERLAP:100}
rag.default-top-k=${RAG_DEFAULT_TOP_K:5}
